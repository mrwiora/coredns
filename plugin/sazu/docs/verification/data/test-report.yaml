document:
  id: SAZU-TR
  version: '1.2'
  title: Test Report
execution_summary:
  stats:
  - label: tests run
    value: 2184
  - label: failures
    value: 0
  - label: errors
    value: 0
  - label: skipped
    value: 2
  - label: packages
    value: 110
  details:
  - item: Command
    value: go test -json ./...
  - item: Result
    value: |-
      <span class="pill ok">PASS</span> (exit code 0)
  - item: Commit
    value: 5101e77e8
  - item: Branch
    value: feat/sazu
  - item: Report format
    value: |-
      JUnit XML, generated from the JSON stream via <code class="inline">go-junit-report
      v2</code>
  narrative:
  - |-
    This is the fourth full run performed during this engineering effort. The first, at
    commit <code class="inline">c9abc9c34</code>, recorded 2078 tests; the second, at <code
    class="inline">1c6eacb0e</code>, recorded 2099; the third, at <code
    class="inline">e0583f38c</code>, recorded 2125. The further 26-test increase reflects
    the optional YAML zone format and friendlier transport defaults added to <code
    class="inline">sazuctl</code> (<code class="inline">zoneyaml_test.go</code>, additional
    <code class="inline">main_test.go</code>/<code class="inline">e2e_test.go</code> cases),
    plus the four new tests directly verifying the per-zone update-locking change (<code
    class="inline">concurrency_test.go</code>) documented in §6. All four runs are 0
    failures, 0 errors; this run was additionally repeated once immediately afterward under
    <code class="inline">go test -race</code>, also 0 failures, specifically to confirm the
    locking change introduced no data race.
  - |-
    A fifth, smaller run closed the two genuine test-coverage gaps this dossier's YAML
    migration found and had recorded as honest <code class="inline">coverage_exceptions</code>
    (AUTH-04, CARRIER-06) rather than silently passing validation: <code
    class="inline">TestServeUpdateFailsClosedWhenNoRawBytesCaptured</code> (<code
    class="inline">handler_test.go</code>) drives <code class="inline">serveUpdate</code>
    directly with a response writer for which nothing was ever captured, proving the SERVFAIL
    fail-closed path fires; <code class="inline">TestSendOverHTTPRoundTrips</code> (<code
    class="inline">cmd/sazuctl/https_test.go</code>) runs <code
    class="inline">sazuctl</code>'s own client-side <code class="inline">sendOverHTTP</code>
    against a real <code class="inline">httptest.Server</code>, table-driven over an accepted
    and a denied response. Both requirements now carry a real citation in the Test
    Specification instead of an exception entry. +4 tests (1 in <code
    class="inline">plugin/sazu</code>, 3 in <code class="inline">plugin/sazu/cmd/sazuctl</code>
    once its table-driven subtests are counted individually), 0 failures, 0 errors, no other
    package affected.
  - |-
    A sixth run closed the four remaining <code class="inline">coverage_exceptions</code>
    entries (NFR-01, NFR-03, NFR-04, NFR-05) the same honest way: each now carries a real
    citation in the Test Specification's NFR area (TC-NFR-04 … 07) instead of an exception.
    Three cite an already-existing, already-passing test case that genuinely does verify the
    requirement even though it wasn't previously cited as doing so (<code
    class="inline">TestDBCommitUpdateRollsBackOnMalformedOp</code> for NFR-03, <code
    class="inline">TestServerHTTPSRejectsUpdate</code>/<code
    class="inline">TestServerHTTPS3RejectsUpdate</code> for NFR-04, <code
    class="inline">TestParseSazu</code>'s no-options case for NFR-05); one is a genuinely new
    test, <code class="inline">TestDBUsesPureGoSQLiteDriver</code> (<code
    class="inline">db_test.go</code>), which checks <code
    class="inline">sql.Drivers()</code> directly to confirm modernc.org/sqlite's pure-Go
    driver is what's actually registered under the name <code class="inline">sqlite</code>
    and that no cgo-based alternative is, for NFR-01. <code
    class="inline">coverage_exceptions</code> is now empty: every requirement in this
    document has a real citation. +1 test (<code class="inline">plugin/sazu</code>), 0
    failures, 0 errors.
  - |-
    A seventh run added RFC 5155 NSEC3 (CONTENT-13): an opt-in alternative to plain NSEC
    (CONTENT-07) that additionally hides a zone's owner-name set from enumeration. <code
    class="inline">nsec3.go</code>'s <code class="inline">BuildNSEC3Chain</code> is <code
    class="inline">BuildNSECChain</code>'s RFC 5155 equivalent; <code
    class="inline">BuildFullZonePushNSEC3</code>/<code
    class="inline">BuildFullZonePushSplitNSEC3</code> are new entry points alongside the
    existing plain-NSEC ones (choosing NSEC3 is a push-time decision the signer makes, not a
    server-side toggle), exposed as <code class="inline">sazuctl push-zone</code>'s <code
    class="inline">-nsec3</code>/<code class="inline">-nsec3-iterations</code>/<code
    class="inline">-nsec3-salt</code>/<code class="inline">-nsec3-opt-out</code> flags.
    <code class="inline">ZoneData.NegativeProof</code> branches on whether an NSEC3PARAM
    record is present at the apex, computing the closest encloser and next-closer name from
    the server's own plaintext copy of the zone's name set and hashing exactly the candidates
    it needs a record for, rather than walking the hash ring blind the way an external
    resolver would have to. Covered at three levels: chain construction and hashing
    (nsec3_test.go, unit level), a real onboarded zone serving a genuinely verifying NSEC3
    proof for both NODATA and NXDOMAIN plus the partial-push invalidation behavior
    (nsec3_test.go, end to end against a real <code class="inline">dnsserver.Server</code>),
    and the actual <code class="inline">sazuctl push-zone -nsec3</code> CLI flag proven to
    change what the server serves (cmd/sazuctl/e2e_test.go). +12 tests (11 in <code
    class="inline">plugin/sazu</code>, 1 in <code class="inline">plugin/sazu/cmd/sazuctl</code>),
    0 failures, 0 errors, also re-run clean under <code class="inline">go test -race</code>.
  - |-
    An eighth run closed the "a partial push always invalidates the chain" limitation
    CONTENT-09 previously stated unconditionally (now narrowed to "carrying no valid patch
    of its own"): <code class="inline">plugin/sazu/chainpatch.go</code>'s <code
    class="inline">ComputeChainPatch</code> (CONTENT-14) lets <code
    class="inline">push-update</code> patch an existing NSEC/NSEC3 chain incrementally,
    using a small local cache <code class="inline">sazuctl</code> keeps per zone (written by
    every full push, updated by every successful patch) rather than any network round trip
    to reconstruct chain state. Server side, this reuses RFC 2136 §2.4.2 value-dependent
    prerequisites (already how the SOA-serial staleness guard works) to reject a patch
    outright, with the zone's actual current record attached, if the client's cache has
    drifted (<code class="inline">ERR_STALE_CHAIN</code>) -- covered directly
    (<code class="inline">TestEvaluatePrerequisitesStaleChainRecordReturnsCurrentValue</code>)
    and end to end (<code class="inline">TestServerAcceptsIncrementalChainPatchWithoutPurging</code>,
    <code class="inline">TestServerRejectsStaleChainPatchAndReturnsCurrentValue</code>), plus
    the CLI's automatic cache-driven wiring
    (<code class="inline">TestE2EPushUpdateIncrementalChainMaintenance</code>). This run also
    found and fixed a genuine, previously invisible bug (CONTENT-15) this feature's own
    testing was the first thing to notice: a KSK/ZSK rollover or ZSK add/retire carries an
    apex DNSKEY, same as a full push, so purging "on isFullPush" -- the pre-existing
    condition -- discarded the chain on every key rotation even though rotation touches no
    served content and supplies no replacement chain; fixed by keying the purge decision on
    whether a real SOA (an actual full push) or other real content change is present instead
    (<code class="inline">TestKSKRolloverDoesNotPurgeExistingChain</code>). +13 tests (12 in
    <code class="inline">plugin/sazu</code>, 1 in <code class="inline">plugin/sazu/cmd/sazuctl</code>),
    0 failures, 0 errors, also re-run clean under <code class="inline">go test -race</code>.
  - |-
    A ninth run answered a direct question about the eighth run's coverage -- whether a
    domain in the *middle* of a longer chain (both neighbors ordinary domains, not the
    apex) being updated or removed was actually tested. Checking the existing cases showed
    every one of them touched a domain adjacent to the apex on at least one side, never a
    genuinely interior one -- a real coverage gap, not a bug: two new unit cases
    (<code class="inline">TestComputeChainPatchUpdatesInteriorNameNSEC</code>, <code
    class="inline">TestComputeChainPatchRemovesInteriorNameNSEC</code>) against a five-name
    zone confirmed <code class="inline">ComputeChainPatch</code> already handles this
    correctly -- both of the touched domain's real neighbors are left completely untouched
    either way. Writing the equivalent real end-to-end case
    (<code class="inline">TestServerRemovesInteriorDomainViaIncrementalPatch</code>) caught
    a genuine mistake in the *test's own* hand-built removal message, not the feature: it
    deleted only the removed domain's A record via <code class="inline">RemoveRRset</code>,
    leaving that record's own RRSIG behind as an orphan and making the domain still
    "exist" (NODATA instead of NXDOMAIN) -- fixed by using RFC 2136 §2.5.3's
    <code class="inline">RemoveName</code> (delete every RRset at a name at once) instead,
    the correct form for removing a domain's content entirely. +3 tests, all in
    <code class="inline">plugin/sazu</code>, 0 failures, 0 errors, also re-run clean under
    <code class="inline">go test -race</code>.
