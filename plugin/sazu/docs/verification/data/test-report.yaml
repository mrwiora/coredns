defects:
  abstract: |-
    An honest retrospective. Every item below was found by the assistant's own testing
    discipline — running the full suite after each change — not reported by an external
    user, and every item was fixed before this report was produced.
  rows:
  - n: 1
    summary: |-
      An early refactor of the key-rollover flow in <code class="inline">serveUpdate</code>
      accidentally skipped SIG(0) verification entirely for first-contact pushes.
    impact: |-
      Critical — would have allowed unauthenticated zone onboarding.
    resolution: |-
      Caught by full-suite failures; candidate-resolution flow restructured; regression
      covered by the existing AUTH/CHAIN test set.
  - n: 2
    summary: |-
      Global per-source-IP rate limiting did not exist; a scanning attacker could probe
      unlimited distinct zone names from one address, since each zone's own quota is
      independent.
    impact: |-
      High — resource exhaustion / zone-discovery scanning at will.
    resolution: |-
      <code class="inline">IPRateLimiter</code> (§SEC-02) added, checked first in <code
      class="inline">serveUpdate</code> ahead of any chain-of-trust work.
  - n: 3
    summary: |-
      The new per-IP limiter (and the pre-existing per-zone limiter) keyed on data reachable
      over connectionless UDP, where the source address can be spoofed without completing a
      handshake.
    impact: |-
      High — an attacker could exhaust a victim address's quota, or attempt to defeat the
      limiter's own accounting, by spoofing UDP source addresses; undermines SEC-02's purpose.
    resolution: |-
      <code class="inline">connectionOriented</code> gate (§SEC-01) added: first-contact and
      rollover attempts are refused outright over any non-connection-oriented transport (plain
      UDP), forcing an attacker to complete a real TCP/TLS/QUIC handshake first.
  - n: 4
    summary: |-
      Both sliding-window rate limiters accumulated one map entry per distinct key (zone name
      or source address) forever, with no eviction.
    impact: |-
      Medium — unbounded memory growth under sustained scanning or churn, a slow
      denial-of-service against the server process itself.
    resolution: |-
      <code class="inline">sweepIfDue</code> (§SEC-04) added: both limiters garbage-collect
      entries older than one window, at most once per window, bounding memory to recently
      active keys.
  - n: 5
    summary: |-
      Every rejected update attempt, including the two rejection reasons above, was written to
      the audit-trail database — an attacker who could trigger cheap rejections (a malformed
      transport or exhausted quota) could grow the audit table without bound.
    impact: |-
      Medium — unbounded disk growth, independent of the memory fix in item 4.
    resolution: |-
      Transport-gate and rate-limit rejections (§SEC-05) are explicitly excluded from
      audit-trail recording; genuine authentication/chain-of-trust failures remain fully
      audited, since those require real per-attempt cryptographic work by the attacker and are
      inherently self-limiting.
  - n: 6
    summary: |-
      The first hand-written test for the UDP-transport gate used <code
      class="inline">BuildFullZonePush</code> (SOA + NSEC + RRSIGs), producing a message over
      512 bytes and tripping RFC&nbsp;1035's UDP truncation before ever reaching the new gate
      — a false pass for the wrong reason.
    impact: None (test-authoring issue, caught before merge).
    resolution: |-
      Discovered that <code class="inline">containsAPEXSOA</code> is checked <em>after</em>
      the chain-of-trust walk, meaning the smallest real attack packet needs only a DNSKEY-add
      + SIG(0). Rewrote using a new <code class="inline">minimalFirstContactWire</code> helper
      matching that minimal, realistic shape — a more accurate test of the actual threat.
  - n: 7
    summary: |-
      <code class="inline">sazuctl</code>'s UDP-vs-TCP transport choice was purely
      message-size-based; a small <code class="inline">rotate-key -role ksk</code> push — a
      real KSK rollover, which SEC-01 requires a connection-oriented transport for regardless
      of size — went out over plain UDP and was correctly, but unhelpfully, refused (<code
      class="inline">ERR_TRANSPORT_NOT_ALLOWED</code>) by a fully compliant server.
    impact: |-
      Low (usability/correctness for a real operator workflow, not a security gap — the
      server-side gate this ran into is exactly what SEC-01 requires).
    resolution: |-
      Found by the new CLI-level end-to-end tests (<code
      class="inline">cmd/sazuctl/e2e_test.go</code>), which exercise the real subcommand entry
      points end to end rather than sending directly over TCP the way earlier in-process tests
      did. Fixed first with a size-conditional <code class="inline">forceTCP</code> override
      for first-contact/rollover pushes specifically, then generalized: reconsidered on
      request, TCP became the unconditional default for every push (<code
      class="inline">chooseNetwork</code>, CLIENT-06), with UDP an explicit, per-command
      opt-in that itself still falls back to TCP with a warning if the message wouldn't fit.
  - n: 8
    summary: |-
      A new CLI-level end-to-end test's own server-startup helper bound a UDP port, then bound
      TCP to that exact same port number — a narrow TOCTOU race that, under load from the rest
      of the suite running concurrently, occasionally lost that port to something else in the
      gap between the two calls, failing the test with a bind error unrelated to anything it
      was actually testing.
    impact: |-
      None (test-infrastructure flakiness, not a product defect — confirmed by two consecutive
      clean full-suite runs after the fix).
    resolution: |-
      Added a small bounded retry (fresh UDP port, retry the TCP bind) to the affected helper
      (<code class="inline">cmd/sazuctl/e2e_test.go</code>).
  - n: 9
    summary: |-
      The identical UDP/TCP port-binding race (item 8) recurred in a second, older test helper
      -- <code class="inline">plugin/sazu/handler_test.go</code>'s <code
      class="inline">serveThroughRealServer</code>, used throughout this package's own test
      suite -- surfaced by a real failure under <code class="inline">go test -race</code>
      while verifying the per-zone update-locking change (NFR-02), which runs noticeably more
      concurrent server instances than the suite did before.
    impact: |-
      None (test-infrastructure flakiness, not a product defect -- confirmed by two
      consecutive clean <code class="inline">-race</code> runs after the fix).
    resolution: |-
      Applied the identical bounded-retry fix from item 8 to this second helper.
  - n: 10
    summary: |-
      A first draft of the concurrency test proving one zone's slow chain-of-trust walk
      doesn't block another zone's push sent the slow zone's request from a background
      goroutine and called <code class="inline">t.Fatalf</code> there on failure -- which,
      called from any goroutine other than the one running the test function, exits only that
      goroutine (via <code class="inline">runtime.Goexit</code>) without ever reaching the
      line that would have sent a result on the channel the main goroutine was unconditionally
      waiting on, hanging the whole test run rather than failing it.
    impact: |-
      None (test-authoring issue, caught before merge -- the whole `go test` invocation hung
      until manually killed).
    resolution: |-
      Rewrote the background call to report failure through a plain error return instead of
      <code class="inline">t.Fatalf</code>, and wrapped the final channel receive in a <code
      class="inline">select</code> with its own timeout, so a similar mistake fails the test
      cleanly instead of hanging it.
conclusion:
  paragraphs:
  - |-
    All 87 requirements in the companion Requirements Specification are traced to at least
    one passing automated test case, or to a manually-verified real-binary scenario for the
    small remaining subset (the real self-signed-TLS HTTPS carrier and the real three-binary
    <code class="inline">sazu-watchd</code> chain) that automated coverage reaches only
    indirectly. The full repository test suite — 2184 tests across 110 packages, including
    every package this work touched directly and every pre-existing package alongside it —
    passes with 0 failures and 0 errors at commit <code class="inline">5101e77e8</code> on
    <code class="inline">feat/sazu</code>, confirmed by two consecutive clean runs (and,
    specifically for the per-zone locking change, two further clean runs under <code
    class="inline">go test -race</code>). Ten real defects were found and resolved during
    development through the assistant's own iterative testing discipline, each documented in
    §6 with its impact and resolution.
  - |-
    On this evidence, the SAZU implementation in this branch is assessed as meeting its
    Requirements Specification and ready for external review.
  signoff:
  - field: Prepared by
    value: Claude Sonnet 5, Claude Code
  - field: Date
    value: '2026-09-15'
  - field: Machine-readable companion
    value: JUnit XML test report (delivered separately)
