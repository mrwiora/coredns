manual_verification:
  intro: |-
    Performed during development against separately compiled binaries over real sockets; not
    part of the repeatable <code class="inline">go test</code> suite. Recorded in full in
    the companion Test Report §5.
  entries:
  - |-
    A real <code class="inline">coredns</code> binary onboarding a zone via a real <code
    class="inline">sazuctl</code> push over UDP/TCP, and serving it correctly afterwards.
  - |-
    A real <code class="inline">coredns</code> HTTPS listener (genuine self-signed TLS
    handshake) accepting a real <code class="inline">sazuctl</code> push in both raw-bytes
    and JSON-envelope form.
  - |-
    A real three-binary chain — <code class="inline">coredns</code>, <code
    class="inline">sazuctl</code>, <code class="inline">sazu-watchd</code> — sharing one
    SQLite file, with <code class="inline">sazu-watchd</code> independently reading the
    zone, key, and contact rows CoreDNS wrote.
  - |-
    The <code class="inline">ip_rate_limit</code> Corefile directive against a real binary,
    reproducing the exact multi-zone scanning scenario TC-SEC-06 automates.
