    functions: TestDBRecordTransactionAndRecentTransactions
    verifies: OPS-02, OPS-03
  - id: TC-OPS-03
    objective: |-
      <code class="inline">rate_limit</code>/<code class="inline">ip_rate_limit</code>
      Corefile directives parse correctly, default correctly when omitted, and reject
      malformed arguments; the plugin wires up with or without persistence.
    functions: |-
      TestParseSazu, TestParseSazuRateLimitDefaultsAndOverride,
      TestParseSazuIPRateLimitDefaultAndOverride, TestSetupWiresPluginAndOptionalDB,
      TestSetupWithoutDBIsPurelyInMemory
    verifies: OPS-05, PERSIST-04
- id: watch
  title: WATCH
  cases:
  - id: TC-WATCH-01
    objective: |-
      A zone's first observation establishes a baseline without alerting, even if already
      failing.
    functions: |-
      TestCheckOnceFirstObservationEstablishesBaselineWithoutAlerting (sazu_watchd)
    verifies: WATCH-03, WATCH-05
  - id: TC-WATCH-02
    objective: |-
      An alert fires on OK→failing and failing→OK; none fires while the outcome is unchanged.
    functions: |-
      TestCheckOnceAlertsOnTransitionFromOKToFailing, TestCheckOnceAlertsOnRecovery,
      TestCheckOnceStaysSilentAcrossRepeatedIdenticalOutcomes
    verifies: WATCH-01, WATCH-03
  - id: TC-WATCH-03
    objective: |-
      Multiple zones are tracked independently; a transition with no registered contact is
      still logged.
    functions: |-
      TestCheckOnceHandlesMultipleZonesIndependently,
      TestCheckOnceAlertWithNoRegisteredContactStillReported
    verifies: WATCH-01, WATCH-02
  - id: TC-WATCH-04
    objective: |-
      A webhook alert posts the expected JSON, reports a non-2xx response, omits the error
      field on recovery, and dispatches to multiple addresses independently.
    functions: |-
      TestNotifierSendWebhookPostsExpectedPayload, TestNotifierSendWebhookReportsNonOKStatus,
      TestNotifierSendRecoveryPayloadCarriesNoError,
      TestNotifierSendDispatchesToMultipleAddressesIndependently
    verifies: WATCH-04
  - id: TC-WATCH-05
    objective: |-
      An email alert fails clearly with no SMTP configured or an invalid address; an
      unrecognised scheme is reported as an error.
    functions: |-
      TestNotifierSendEmailWithoutSMTPAddrConfiguredFails,
      TestNotifierSendEmailRejectsInvalidAddress, TestNotifierSendUnknownSchemeReportsError
    verifies: WATCH-04
- id: persist
  title: PERSIST
  cases:
  - id: TC-PERSIST-01
    objective: |-
      A committed update reproduces identically after a full reload (key, SOA, RRset).
    functions: TestDBCommitUpdateThenLoadAllReproducesOnboarding
    verifies: PERSIST-02, PERSIST-03
  - id: TC-PERSIST-02
    objective: |-
      State survives a real close-and-reopen of the database file.
    functions: TestDBPersistsAcrossReopen
    verifies: PERSIST-01, PERSIST-03
  - id: TC-PERSIST-03
    objective: |-
      Registering and retiring a ZSK persist and reload correctly via <code
      class="inline">LoadZoneKeys</code>, independently of the KSK; the lighter-weight <code
      class="inline">LoadKey</code> accessor keeps returning only the KSK.
    functions: TestDBCommitUpdateAddsAndRetiresZSK
    verifies: KEY-08, KEY-09, PERSIST-02
  - id: TC-PERSIST-04
    objective: |-
      A KSK rollover replaces that zone's sole KSK database row rather than leaving the
      superseded key tag behind as a stale second row.
    functions: TestDBCommitUpdateKSKRolloverReplacesRowNotAdds
    verifies: KEY-05, PERSIST-02
  - id: TC-PERSIST-05
    objective: |-
      A database written before the optional-ZSK key-storage schema existed is transparently
      migrated in place on open — every pre-existing key becomes that zone's KSK, and a second
      <code class="inline">Open</code> on an already-migrated database is a safe no-op.
    functions: TestDBOpenMigratesPreZSKKeysTable
    verifies: PERSIST-05
- id: client
  title: CLIENT
  cases:
  - id: TC-CLIENT-01
    objective: |-
      Every embedded guidance template (onboarding-denied diagnostics, the rotate-key
      tradeoff) executes without error against the data its caller passes it, and renders
      non-empty output.
    functions: TestGuidanceTemplatesRenderWithoutError
    verifies: CLIENT-03, CLIENT-04
  - id: TC-CLIENT-02
    objective: |-
      The no-DS guidance text actually contains the concrete, actionable values a customer
      needs (the DS record's fields, the zone name, a ready-to-run <code
      class="inline">dig</code> command) — not just that it renders.
    functions: TestNoDSGuidanceIncludesTheDSRecordAndZone
    verifies: CLIENT-03
  - id: TC-CLIENT-03
    objective: |-
      The rotate-key decision text actually branches on whether a ZSK already exists — naming
      its key tag when one does, pointing at <code class="inline">add-zsk</code> first when
      none does — rather than printing the same generic advice regardless of zone state.
    functions: |-
      TestRotateKeyChoiceGuidanceReflectsWhetherAZSKExists
    verifies: CLIENT-04
  - id: TC-CLIENT-04
    objective: |-
      The small display/parsing helpers the CLI and its guidance depend on — DNSKEY flags to a
      KSK/ZSK label, algorithm number to name, and the <code class="inline">-role</code>
      flag's three cases — are correct.
    functions: |-
      TestKeyTypeLabelAndAlgorithmLabel, TestParseRoleFlag
    verifies: CLIENT-01
  - id: TC-CLIENT-05
    objective: |-
      End-to-end through the real CLI entry points: the KSK use case (see TC-KEY-18) and the
      ZSK use case (see TC-KEY-19), each driving the actual <code class="inline">run*</code>
      subcommand functions <code class="inline">main</code> itself dispatches to against a
      real server — not a direct call into the plugin package.
    functions: |-
      TestE2EKSKFullLifecycle, TestE2EZSKFullLifecycle,
      TestE2ERotateKeyZSKRoleRegistersThenRetires
    verifies: CLIENT-01, CLIENT-02, CLIENT-04, CLIENT-05
  - id: TC-CLIENT-06
    objective: |-
      The transport decision is TCP regardless of message size by default, opts into UDP only
      when explicitly allowed and the message actually fits, and falls back to TCP with a
      specific, informative warning otherwise.
    functions: |-
      TestChooseNetworkDefaultsToTCPRegardlessOfSize,
      TestChooseNetworkAllowUDPUsesUDPWhenItFits,
      TestChooseNetworkAllowUDPFallsBackToTCPWithWarningWhenTooLarge
    verifies: CLIENT-06
  - id: TC-CLIENT-07
    objective: |-
      An ordinary email address converts to the correct RFC&nbsp;1035 §8.13 SOA mailbox
      encoding, including escaping a literal dot in the local part; a malformed address is
      rejected.
    functions: |-
      TestEmailToMboxConvertsOrdinaryAddress, TestEmailToMboxEscapesLiteralDotsInLocalPart,
      TestEmailToMboxRejectsAddressWithoutAt
    verifies: CLIENT-07
  - id: TC-CLIENT-08
    objective: |-
      An SOA serial of <code class="inline">"auto"</code> or empty resolves to today's date as
      YYYYMMDD00; an explicit numeric serial is used as given; a non-numeric, non-"auto" value
      is rejected.
    functions: |-
      TestResolveSerialAutoIsTodayAsYYYYMMDD00, TestResolveSerialEmptyIsAlsoAuto,
      TestResolveSerialAcceptsExplicitNumber, TestResolveSerialRejectsGarbage,
      TestDateSerialFormat
    verifies: CLIENT-07
  - id: TC-CLIENT-09
    objective: |-
      A YAML zone definition converts to the same (SOA, records) shape a real zone file
      produces — apex/relative/absolute record names resolve correctly, a record's own TTL
      overrides the zone default, and required fields (SOA nameserver, mailbox source, record
      type/value) are enforced — round-tripping correctly through an actual file on disk, and
      <code class="inline">push-zone</code>'s own loader dispatches to it purely by file
      extension.
    functions: |-
      TestRecordOwnerNameResolvesApexRelativeAndAbsolute,
      TestYamlZoneToRRsBuildsSOAAndRecords, TestYamlZoneToRRsRejectsMissingAdminEmailOrMbox,
      TestYamlZoneToRRsRejectsMissingNS, TestYamlZoneToRRsFallsBackToGivenZoneWhenFileOmitsIt,
      TestYamlZoneToRRsRejectsRecordWithoutTypeOrValue,
      TestLoadYAMLZoneRoundTripsThroughAFile, TestLoadZoneSourceDispatchesOnExtension
    verifies: CLIENT-07
  - id: TC-CLIENT-10
    objective: |-
      End-to-end: <code class="inline">init-zone</code> writes a starter YAML definition <code
      class="inline">push-zone</code> accepts directly (no conversion step) and which onboards
      correctly; it refuses to overwrite an existing file; <code
      class="inline">zone-convert</code>'s generated BIND-format output is itself directly
      pushable.
    functions: |-
      TestE2EInitZoneThenPushZoneWithYAML, TestE2EInitZoneRefusesToOverwriteExistingFile,
      TestE2EZoneConvertProducesAPushableZoneFile
    verifies: CLIENT-07
- id: nfr
  title: NFR
  abstract: |-
    NFR-02 (per-zone, not global, update serialization) is specific enough to warrant its
    own dedicated tests (TC-NFR-01 … 03, below). The other four are each still cited from a
    concrete, already-existing test case rather than a dedicated one of their own, since
    each is a property of the *rest of the suite passing*, not of any single scenario: NFR-01
    (no cgo) by <code class="inline">TestDBUsesPureGoSQLiteDriver</code> directly checking
    which driver is registered, and by every package here still building and testing
    successfully with CGO_ENABLED implicitly unset; NFR-03 (persistence consistency) by the
    PERSIST area's transactional-rollback case (§3.12); NFR-04 (HTTPS/HTTP3 backward
    compatibility) by CARRIER's default-rejects-UPDATE case (§3.8); NFR-05 (safe defaults) by
    <code class="inline">TestParseSazu</code>'s no-options case directly asserting
    <code class="inline">insecureSkipChainValidation</code> defaults to false, plus every
    chain-of-trust/algorithm-floor/rate-limiting case throughout this catalogue passing with
    its respective safeguard left at that default.
  cases:
  - id: TC-NFR-01
    objective: |-
      The per-zone lock stripe is a pure, stable function of the (case/FQDN-normalized) zone
      name, and a realistic number of distinct zone names spreads across most of the available
      stripes rather than colliding onto a handful.
    functions: |-
      TestUpdateLockForIsStableForTheSameZone, TestUpdateLockForSpreadsAcrossStripes
    verifies: NFR-02
  - id: TC-NFR-02
    objective: |-
      End-to-end: a slow, in-flight first-contact chain-of-trust walk for one zone (a fake,
      delay-injecting validator standing in for the real network round trip) does not delay an
      unrelated, already-authenticated push to a different zone.
    functions: |-
      TestConcurrentUpdatesToDifferentZonesDoNotSerialize
    verifies: NFR-02
  - id: TC-NFR-03
    objective: |-
      Switching from one global lock to per-zone stripes does not weaken correctness for the
      *same* zone: 20 concurrent differential pushes to one already-onboarded zone all still
      apply, with none silently lost to a race.
    functions: |-
      TestConcurrentUpdatesToSameZoneStillSerializeCorrectly
    verifies: NFR-02
  - id: TC-NFR-04
    objective: |-
      The registered <code class="inline">database/sql</code> driver named
      <code class="inline">sqlite</code> is modernc.org/sqlite's pure-Go implementation; no
      cgo-based alternative (mattn/go-sqlite3, which registers as <code
      class="inline">sqlite3</code>) is registered.
    functions: TestDBUsesPureGoSQLiteDriver
    verifies: NFR-01
  - id: TC-NFR-05
    objective: |-
      A persistence failure mid-transaction leaves the on-disk database exactly as it was
      before the attempt, never partially applied.
    functions: TestDBCommitUpdateRollsBackOnMalformedOp
    verifies: NFR-03
  - id: TC-NFR-06
    objective: |-
      With no opcode explicitly allowed, the HTTPS and HTTP3 servers reject UPDATE exactly as
      they did before this carrier existed -- adding the opt-in changes nothing for a Config
      that never uses it.
    functions: TestServerHTTPSRejectsUpdate, TestServerHTTPS3RejectsUpdate (core/dnsserver)
    verifies: NFR-04
  - id: TC-NFR-07
    objective: |-
      With no Corefile options set, a fresh config's chain-of-trust validation is not
      skipped: <code class="inline">insecure_skip_chain_validation</code> defaults to off.
    functions: TestParseSazu (no-options case)
    verifies: NFR-05
